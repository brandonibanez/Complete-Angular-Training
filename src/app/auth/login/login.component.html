<form [formGroup]="form" (ngSubmit)="form.valid && onSubmit()">
  <h2>Login</h2>
  <div class="control-row">
    <div class="control no-margin">
      <label for="email">Email</label>
      <input id="email" type="email" formControlName="email" (ngModelChange)="test($event)"/>
    </div>

    <div class="control no-margin">
      <label for="password">Password</label>
      <input id="password" type="password" formControlName="password" />
    </div>

    <div class="control no-margin">
      <label for="confirmPassword">Confirm Password</label>
      <input
        id="confirmPassword"
        type="password"
        formControlName="confirmPassword"
      />
    </div>

    <button class="button">Login</button>
  </div>

  @if (form.invalid && form.touched && form.dirty) {
    <p class="error" style="color:red">Please fill out the form correctly.</p>
  }

  <p>{{candidate$ | async}}</p>
</form>
